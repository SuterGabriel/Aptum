name: CI

on:
  push:
    branches: [main]
  pull_request:

# Die Pipeline prüft, sie veröffentlicht nichts. Mehr Rechte braucht sie nicht.
permissions:
  contents: read

# Ein zweiter Push auf denselben Zweig bricht den ersten Lauf ab, statt beide
# zu bezahlen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Die Pipeline hat zwei Zwecke: Qualität sichern und als Guardrail für
# agentische Änderungen dienen. Ein Agent, der gegen eine Projektregel
# verstößt, bekommt hier ein rotes Ergebnis statt eines Review-Kommentars,
# den niemand schreibt.

jobs:
  belege:
    name: Beleg-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Belege prüfen
        run: bash scripts/beleg-check.sh

  dokumente:
    name: Prosa und Verweise
    runs-on: ubuntu-latest
    # Zwei Gates in einem Job, weil beide dieselbe Node-Einrichtung brauchen
    # und zusammen unter einer Sekunde laufen. Sie bleiben getrennte Schritte,
    # damit im roten Lauf ohne Logsuche sichtbar ist, welches der beiden hing.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      # Der Git-Hook prüft nur vorgemerkte Dateien und ist mit --no-verify
      # umgehbar. Hier läuft dieselbe Prüfung über den ganzen Baum — das
      # fängt die Datei, die nie durch den Hook gegangen ist.
      - name: Prosa prüfen
        run: node scripts/prosa-check.mjs
      - name: Verweise prüfen
        run: node scripts/link-check.mjs

  regeln:
    name: Fundstellen der Fachregeln
    runs-on: ubuntu-latest
    # Prüft den Regelkatalog und, sobald es ihn gibt, den Domänencode gegen
    # ihn: keine nackte Zahl in einer Regelklasse, jede Fundstelle existiert
    # und trägt Status BELEGT. Grundlage ist ADR-007.
    #
    # Der wichtigste Befund aus Stufe 0 war, dass falscher Code im Test
    # auffällt und falsche Fachlogik nicht. Ein Test über eine erfundene
    # Frist ist grün. Das ist der Job, der das abfängt.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fundstellen prüfen
        run: node scripts/regel-check.mjs
      # Das Gate wird selbst getestet: 21 Fälle, darunter zwei Lücken, die
      # nichts gemeldet haben und nur durch Gegenproben von Hand auffielen.
      - name: Regel-Check testen
        run: node --test scripts/regel-check.test.mjs

  kontrast:
    name: Kontrast der Farbtoken
    runs-on: ubuntu-latest
    # Rechnet die Kontrastwerte aus den Farbtoken nach, statt sie zu schätzen.
    # Fast alle Behauptungen von WCAG-Konformität beruhen auf einem einmaligen
    # manuellen Blick. Dieser Job macht daraus eine Zusage, die kaputtgehen
    # kann, sobald jemand eine Farbe anfasst.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Kontraste nachrechnen
        run: node scripts/kontrast-check.mjs

  backend:
    name: Backend bauen und testen
    runs-on: ubuntu-latest
    # Alle drei Module: domain, application, infrastructure. Java 21 und Maven
    # nach ADR-008. Die Infrastruktur-Tests starten ein echtes Postgres über
    # Testcontainers - ubuntu-latest bringt Docker mit. Darunter der
    # Isolationstest aus ADR-002: Mandant A sieht nichts von Mandant B.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Formatierung, Tests und ArchUnit in einem Lauf. ArchUnit prüft im
      # Domain-Modul, was die Domäne nicht kennt, und in infrastructure, wer
      # wen kennen darf - ADR-001 bei jedem Lauf, nicht nur behauptet.
      - name: Format, Tests, ArchUnit
        run: mvn -B --file services/scheduling/pom.xml spotless:check test
      # Wenn ein Test rot ist, gehört der Bericht dazu - nicht nur das Log.
      - name: Testberichte sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: services/scheduling/**/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend prüfen und bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Die Schritte sind getrennt, damit im roten Lauf ohne Logsuche sichtbar
    # ist, welcher hing. Die billigen zuerst. Die API-Typen werden aus dem
    # OpenAPI-Dokument neu erzeugt und mit der eingecheckten Fassung
    # verglichen - dieselbe Drift-Prüfung wie im Backend, eine Ebene weiter.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Format
        run: npm run format:check
      - name: Lint (inklusive Template-Regeln zur Barrierefreiheit)
        run: npm run lint
      - name: API-Typen aktuell
        run: npm run api:types && git diff --exit-code -- src/app/api/
      - name: Unit-Tests
        run: npm test
      - name: Build mit Budget
        run: npm run build

  e2e:
    name: Ende-zu-Ende mit axe
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Backend und Frontend zusammen, im echten Chromium: Der Test bucht über
    # die API, findet den Termin im Grid, fährt mit der Tastatur hindurch und
    # lässt axe über jede Seite laufen. Das ist die Merge-Bedingung aus dem
    # Skill a11y-grid als Lauf, nicht als Satz. Läuft erst, wenn die
    # billigeren Jobs grün sind - ein Tippfehler im Java braucht kein Chromium.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aptum
          POSTGRES_PASSWORD: aptum
          POSTGRES_DB: aptum
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aptum" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend bauen
        run: mvn -B -q --file services/scheduling/pom.xml package -DskipTests
      # Dieselbe Trennung wie im Betrieb und im Isolationstest: Flyway als
      # Eigentümer, die Anwendung als Rolle ohne Rechte an den Tabellen.
      - name: Anwendungsrolle anlegen
        run: PGPASSWORD=aptum psql -h localhost -U aptum -d aptum -c "create role aptum_app login password 'aptum';"
      - name: Backend starten
        run: |
          nohup java -jar services/scheduling/infrastructure/target/scheduling-infrastructure-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 1; done
          echo "Backend nicht gestartet"; cat backend.log; exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright mit axe
        run: npx playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - name: Bericht und Traces sichern
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
          retention-days: 7

  # --- Noch offen --------------------------------------------------------
  # Bewusst als auskommentiertes Gerüst, nicht als leerer Job, der immer
  # grün ist. Ein Job, der nichts prüft und trotzdem grün meldet, ist
  # schlimmer als kein Job.
  #
  # security:
  #   Dependency-Scan und Container-Scan.
  #
  # evals:
  #   Nur bei Änderungen an Prompts oder AI-Code, weil der Job Geld kostet.
  #   Ergebnis und Differenz zum letzten Lauf als Kommentar am Pull Request.
