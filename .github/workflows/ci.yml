name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Die Evals von Hand anstoßen, etwa nach einem Modellwechsel beim Anbieter.
  workflow_dispatch:

# Die Pipeline prüft, sie veröffentlicht nichts. Mehr Rechte braucht sie nicht.
# Jede Action ist auf einen Commit gepinnt, die Hauptversion steht als
# Kommentar dahinter; Dependabot hebt beides zusammen an. Ein Tag kann
# verschoben werden, ein Commit nicht - das war ein Fund von SonarCloud.
permissions:
  contents: read

# Ein zweiter Push auf denselben Zweig bricht den ersten Lauf ab, statt beide
# zu bezahlen.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Die Pipeline hat zwei Zwecke: Qualität sichern und als Guardrail für
# agentische Änderungen dienen. Ein Agent, der gegen eine Projektregel
# verstößt, bekommt hier ein rotes Ergebnis statt eines Review-Kommentars,
# den niemand schreibt.

jobs:
  belege:
    name: Beleg-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Belege prüfen
        run: bash scripts/beleg-check.sh

  dokumente:
    name: Prosa und Verweise
    runs-on: ubuntu-latest
    # Zwei Gates in einem Job, weil beide dieselbe Node-Einrichtung brauchen
    # und zusammen unter einer Sekunde laufen. Sie bleiben getrennte Schritte,
    # damit im roten Lauf ohne Logsuche sichtbar ist, welches der beiden hing.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      # Der Git-Hook prüft nur vorgemerkte Dateien und ist mit --no-verify
      # umgehbar. Hier läuft dieselbe Prüfung über den ganzen Baum — das
      # fängt die Datei, die nie durch den Hook gegangen ist.
      - name: Prosa prüfen
        run: node scripts/prosa-check.mjs
      - name: Verweise prüfen
        run: node scripts/link-check.mjs

  regeln:
    name: Fundstellen der Fachregeln
    runs-on: ubuntu-latest
    # Prüft den Regelkatalog und, sobald es ihn gibt, den Domänencode gegen
    # ihn: keine nackte Zahl in einer Regelklasse, jede Fundstelle existiert
    # und trägt Status BELEGT. Grundlage ist ADR-007.
    #
    # Der wichtigste Befund aus Stufe 0 war, dass falscher Code im Test
    # auffällt und falsche Fachlogik nicht. Ein Test über eine erfundene
    # Frist ist grün. Das ist der Job, der das abfängt.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Fundstellen prüfen
        run: node scripts/regel-check.mjs
      # Das Gate wird selbst getestet: 21 Fälle, darunter zwei Lücken, die
      # nichts gemeldet haben und nur durch Gegenproben von Hand auffielen.
      - name: Regel-Check testen
        run: node --test scripts/regel-check.test.mjs

  kontrast:
    name: Kontrast der Farbtoken
    runs-on: ubuntu-latest
    # Rechnet die Kontrastwerte aus den Farbtoken nach, statt sie zu schätzen.
    # Fast alle Behauptungen von WCAG-Konformität beruhen auf einem einmaligen
    # manuellen Blick. Dieser Job macht daraus eine Zusage, die kaputtgehen
    # kann, sobald jemand eine Farbe anfasst.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: Kontraste nachrechnen
        run: node scripts/kontrast-check.mjs

  backend:
    name: Backend bauen und testen
    runs-on: ubuntu-latest
    # Alle drei Module: domain, application, infrastructure. Java 21 und Maven
    # nach ADR-008. Die Infrastruktur-Tests starten ein echtes Postgres über
    # Testcontainers - ubuntu-latest bringt Docker mit. Darunter der
    # Isolationstest aus ADR-002: Mandant A sieht nichts von Mandant B.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Formatierung, Tests und ArchUnit in einem Lauf. ArchUnit prüft im
      # Domain-Modul, was die Domäne nicht kennt, und in infrastructure, wer
      # wen kennen darf - ADR-001 bei jedem Lauf, nicht nur behauptet.
      - name: Format, Tests, ArchUnit, Abdeckung
        run: mvn -B --file services/scheduling/pom.xml spotless:check verify
      - name: Abdeckung für Sonar sichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abdeckung-backend
          path: services/scheduling/**/target/site/jacoco/jacoco.xml
          retention-days: 1
      # Wenn ein Test rot ist, gehört der Bericht dazu - nicht nur das Log.
      - name: Testberichte sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: services/scheduling/**/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend prüfen und bauen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    # Die Schritte sind getrennt, damit im roten Lauf ohne Logsuche sichtbar
    # ist, welcher hing. Die billigen zuerst. Die API-Typen werden aus dem
    # OpenAPI-Dokument neu erzeugt und mit der eingecheckten Fassung
    # verglichen - dieselbe Drift-Prüfung wie im Backend, eine Ebene weiter.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
      - name: Format
        run: npm run format:check
      - name: Lint (inklusive Template-Regeln zur Barrierefreiheit)
        run: npm run lint
      - name: API-Typen aktuell
        run: npm run api:types && git diff --exit-code -- src/app/api/
      - name: Unit-Tests mit Abdeckung
        run: npm run test:coverage
      - name: Abdeckung für Sonar sichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abdeckung-frontend
          path: frontend/coverage/aptum/lcov.info
          retention-days: 1
      - name: Build mit Budget
        run: npm run build

  ai-assist:
    name: AI-Layer prüfen und testen
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-assist
    # Der dritte Werkzeugkasten: uv, Ruff, mypy, pytest. Die Tests laufen
    # ohne Schlüssel und ohne Netz gegen aufgezeichnete Antworten - sie
    # prüfen die Pipeline, nicht das Modell. Das Modell prüft der Eval.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-assist/uv.lock
      - run: uv sync --frozen --no-build
      - name: Format
        run: uv run --frozen --no-build ruff format --check .
      - name: Lint
        run: uv run --frozen --no-build ruff check .
      - name: Typen
        run: uv run --frozen --no-build mypy
      - name: Tests mit Abdeckung
        run: uv run --frozen --no-build pytest -q --cov=ai_assist --cov-report=xml
      - name: Abdeckung für Sonar sichern
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: abdeckung-ai-assist
          path: services/ai-assist/coverage.xml
          retention-days: 1

  sonar:
    name: SonarCloud
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-assist]
    # Ein fremdes Werkzeug über alle drei Stacks: Abdeckung, Duplikate,
    # Security Hotspots, Quality Gate. Ersetzt keins der eigenen Gates -
    # Sonar liest keine Prosa und kennt keine Fundstelle. Es ergänzt sie um
    # die Sicht, die jeder Reviewer kennt. Die Abdeckung kommt aus den drei
    # Jobs davor; hier wird nur eingesammelt und kompiliert.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Klassen für die Java-Analyse
        run: mvn -B -q --file services/scheduling/pom.xml test-compile
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: abdeckung-*
          path: abdeckung
      - name: Berichte an ihren Platz
        run: |
          mkdir -p frontend/coverage/aptum services/ai-assist
          find abdeckung/abdeckung-backend -name jacoco.xml | while read f; do
            modul=$(echo "$f" | sed -E 's#.*abdeckung-backend/(services/scheduling/)?([^/]+)/target.*#\2#')
            mkdir -p "services/scheduling/$modul/target/site/jacoco"
            cp "$f" "services/scheduling/$modul/target/site/jacoco/jacoco.xml"
          done
          cp abdeckung/abdeckung-frontend/lcov.info frontend/coverage/aptum/lcov.info
          cp abdeckung/abdeckung-ai-assist/coverage.xml services/ai-assist/coverage.xml
          find services/scheduling -name jacoco.xml
      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: -Dsonar.qualitygate.wait=true

  cluster:
    name: Terraform, ArgoCD und Helm in kind
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-assist]
    # So wird deployt - nicht "so könnte man". Die drei Bilder gehen in die
    # GitHub Container Registry, mit dem Commit als Tag. Terraform stellt in
    # einem kind-Cluster die Plattform (Namespace, Pull-Secret, ArgoCD) und
    # meldet die Anwendung an. ArgoCD liest das Chart aus genau diesem Commit
    # und rollt aus. Dann fragt ein Pod im Cluster durch den Reverse Proxy
    # alle drei Dienste und die Datenbank. Ein Chart, das niemand anwendet,
    # ist eine Behauptung; kind ist kein Betrieb, aber es beweist die Kette.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io/sutergabriel
      TAG: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Das Token kommt über env in den Schritt, nicht als Text im Skript -
      # sonst steht es expandiert im Prozessaufruf und in jedem Debug-Log.
      - name: Bei der Registry anmelden
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BENUTZER: ${{ github.actor }}
        run: echo "$TOKEN" | docker login ghcr.io -u "$BENUTZER" --password-stdin
      - name: Bilder bauen und veröffentlichen
        run: |
          docker compose build
          for i in scheduling ai-assist frontend; do
            docker tag aptum-$i:latest $REGISTRY/aptum-$i:$TAG
            docker push $REGISTRY/aptum-$i:$TAG
          done
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Chart prüfen
        run: helm lint deploy/helm/aptum
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: aptum
          config: deploy/kind/cluster.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      # Stand 1: die Plattform. Das Pull-Secret trägt das Token dieses Laufs -
      # es verfällt mit ihm, und es steht in keiner Datei.
      - name: Terraform, Stand 1 - Plattform
        working-directory: deploy/terraform/plattform
        env:
          TF_VAR_registry_user: ${{ github.actor }}
          TF_VAR_registry_token: ${{ secrets.GITHUB_TOKEN }}
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      # Stand 2: die Anmeldung. Revision ist dieser Commit, nicht main - sonst
      # prüft die Pipeline den Stand von vorhin.
      - name: Terraform, Stand 2 - Anwendung
        working-directory: deploy/terraform/anwendung
        env:
          TF_VAR_revision: ${{ github.sha }}
          TF_VAR_image_registry: ghcr.io/sutergabriel
          TF_VAR_image_tag: ${{ github.sha }}
          TF_VAR_pull_secret: registry
        run: |
          terraform init -input=false
          terraform apply -auto-approve -input=false
      - name: Auf ArgoCD warten
        run: |
          for i in $(seq 1 90); do
            st=$(kubectl get application aptum -n argocd -o jsonpath='{.status.sync.status} {.status.health.status}' 2>/dev/null)
            echo "$st" | grep -q "Synced Healthy" && { echo "ArgoCD: $st"; exit 0; }
            sleep 5
          done
          echo "ArgoCD nicht synchron: '$st'"; exit 1
      # Der Rauchtest aus dem Chart, als Pod im Cluster: Seite, SPA-Fallback,
      # Woche über /api, eine Verordnung durch die Domäne, ein Freitext durch
      # den AI-Dienst. Grün heißt: Die Kette steht, so wie ArgoCD sie gebaut hat.
      - name: Rauchtest im Cluster
        run: |
          helm template aptum deploy/helm/aptum --show-only templates/tests/rauchtest.yaml | kubectl apply -n aptum -f -
          kubectl wait -n aptum --for=jsonpath='{.status.phase}'=Succeeded pod/aptum-rauchtest --timeout=180s
          kubectl logs -n aptum aptum-rauchtest
      - name: Von außen erreichbar
        run: |
          curl -sf -H 'Accept: text/html' localhost:8000/ | grep -q '<app-root'
          curl -sf -H 'X-Mandant: praxis-a' 'localhost:8000/api/kalender/woche?tag=2026-03-02' | grep -q '"spalten"'
      - name: Zustand des Clusters sichern
        if: failure()
        run: |
          kubectl get application aptum -n argocd -o yaml | tail -60 || true
          kubectl get all -n aptum -o wide || true
          kubectl describe pods -n aptum || true
          kubectl logs -n aptum aptum-rauchtest || true
          for c in scheduling ai-assist frontend postgres; do
            echo "=== $c ==="; kubectl logs -n aptum -l app.kubernetes.io/component=$c --tail=100 || true
          done

  evals:
    name: Evals gegen das Modell
    runs-on: ubuntu-latest
    needs: [ai-assist]
    # Kostet Geld, deshalb nur, wenn sich Prompt, Schema, Provider oder die
    # Fälle geändert haben - oder von Hand. Ohne Schlüssel wird der Lauf
    # sichtbar übersprungen: eine Warnung im Lauf, nie ein stummes Grün.
    # Rot ist ein Befund; nur ein Fall, der vorher grün war, bricht den Job.
    defaults:
      run:
        working-directory: services/ai-assist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Hat sich etwas geändert, das das Modell sieht?
        id: relevant
        working-directory: .
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "ja=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          basis="${{ github.event.pull_request.base.sha || github.event.before }}"
          if git diff --name-only "$basis" HEAD | grep -qE '^(evals/|services/ai-assist/src/ai_assist/(prompts/|schema\.py|provider/|erfassung\.py))'; then
            echo "ja=true" >> "$GITHUB_OUTPUT"
          else
            echo "ja=false" >> "$GITHUB_OUTPUT"
            echo "Evals übersprungen: keine Änderung an Prompt, Schema, Provider oder Fällen." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Schlüssel vorhanden?
        id: schluessel
        if: steps.relevant.outputs.ja == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning title=Evals übersprungen::Kein ANTHROPIC_API_KEY als Secret hinterlegt. Die Eval-Suite ist nicht gelaufen."
            echo "**Evals übersprungen** — kein Schlüssel. Die Suite ist nicht gelaufen; das ist kein Grün." >> "$GITHUB_STEP_SUMMARY"
            echo "da=false" >> "$GITHUB_OUTPUT"
          else
            echo "da=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        if: steps.schluessel.outputs.da == 'true'
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-assist/uv.lock
      - run: uv sync --frozen --no-build
        if: steps.schluessel.outputs.da == 'true'
      - name: Eval gegen Anthropic
        if: steps.schluessel.outputs.da == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: uv run --frozen --no-build python ../../evals/run.py --provider anthropic --nicht-speichern | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Eval gegen OpenAI, wenn ein Schlüssel da ist
        if: steps.schluessel.outputs.da == 'true' && env.OPENAI_API_KEY != ''
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: uv run --frozen --no-build python ../../evals/run.py --provider openai --nicht-speichern | tee -a "$GITHUB_STEP_SUMMARY"

  e2e:
    name: Ende-zu-Ende mit axe
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    # Backend und Frontend zusammen, im echten Chromium: Der Test bucht über
    # die API, findet den Termin im Grid, fährt mit der Tastatur hindurch und
    # lässt axe über jede Seite laufen. Das ist die Merge-Bedingung aus dem
    # Skill a11y-grid als Lauf, nicht als Satz. Läuft erst, wenn die
    # billigeren Jobs grün sind - ein Tippfehler im Java braucht kein Chromium.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: aptum
          POSTGRES_PASSWORD: aptum
          POSTGRES_DB: aptum
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U aptum" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Backend bauen
        run: mvn -B -q --file services/scheduling/pom.xml package -DskipTests
      # Dieselbe Trennung wie im Betrieb und im Isolationstest: Flyway als
      # Eigentümer, die Anwendung als Rolle ohne Rechte an den Tabellen.
      - name: Anwendungsrolle anlegen
        run: PGPASSWORD=aptum psql -h localhost -U aptum -d aptum -c "create role aptum_app login password 'aptum';"
      - name: Backend starten
        run: |
          nohup java -jar services/scheduling/infrastructure/target/scheduling-infrastructure-*.jar > backend.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8080/actuator/health && exit 0; sleep 1; done
          echo "Backend nicht gestartet"; cat backend.log; exit 1
      # Der AI-Dienst mit aufgezeichneten Antworten: kein Schlüssel, kein Netz,
      # kein Zufall. Die Seite "Verordnung erfassen" ist damit vollständig
      # testbar - geprüft wird die Kette, nicht das Modell.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: services/ai-assist/uv.lock
      - name: AI-Dienst starten
        working-directory: services/ai-assist
        env:
          AI_ASSIST_PROVIDER: aufzeichnung
          AI_ASSIST_AUFZEICHNUNG: demo-aufzeichnung.json
        run: |
          uv sync --frozen --no-build
          nohup uv run --frozen --no-build uvicorn ai_assist.api:app --port 8090 > ai.log 2>&1 &
          for i in $(seq 1 40); do curl -sf localhost:8090/health && exit 0; sleep 1; done
          echo "AI-Dienst nicht gestartet"; cat ai.log; exit 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund --ignore-scripts
        working-directory: frontend
      - run: npx --no playwright install --with-deps chromium
        working-directory: frontend
      - name: Playwright mit axe
        run: npx --no playwright test
        working-directory: frontend
        env:
          CI: 'true'
      - name: Bericht und Traces sichern
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            services/ai-assist/ai.log
          retention-days: 7

  # --- Noch offen --------------------------------------------------------
  # Bewusst als auskommentiertes Gerüst, nicht als leerer Job, der immer
  # grün ist. Ein Job, der nichts prüft und trotzdem grün meldet, ist
  # schlimmer als kein Job.
  #
  # security:
  #   Dependency-Scan und Container-Scan.
  #
  # evals:
  #   Nur bei Änderungen an Prompts oder AI-Code, weil der Job Geld kostet.
  #   Ergebnis und Differenz zum letzten Lauf als Kommentar am Pull Request.
