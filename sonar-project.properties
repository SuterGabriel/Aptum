# SonarCloud: eine Analyse über alle drei Stacks, aus der CI (Job sonar).
# Die Abdeckung kommt aus JaCoCo, Karma und pytest-cov - jeder Job lädt
# seinen Bericht hoch, der Sonar-Job sammelt sie ein.

sonar.projectKey=SuterGabriel_Aptum
sonar.organization=sutergabriel
sonar.projectName=Aptum

sonar.sourceEncoding=UTF-8

sonar.sources=services/scheduling,frontend/src,services/ai-assist/src,evals,scripts,.github
sonar.tests=services/scheduling,frontend/src,services/ai-assist/tests,frontend/e2e
sonar.test.inclusions=**/src/test/**,**/*.spec.ts,services/ai-assist/tests/**,frontend/e2e/**,scripts/*.test.mjs
sonar.exclusions=**/node_modules/**,**/target/**,**/.venv/**,**/dist/**,frontend/src/app/api/schema.d.ts,scripts/fixtures/**

# Java: Klassen aus dem Build, Abdeckung aus JaCoCo
sonar.java.binaries=services/scheduling/**/target/classes
sonar.java.test.binaries=services/scheduling/**/target/test-classes
sonar.coverage.jacoco.xmlReportPaths=services/scheduling/**/target/site/jacoco/jacoco.xml

# TypeScript: Abdeckung aus Karma
sonar.javascript.lcov.reportPaths=frontend/coverage/aptum/lcov.info

# Python: Abdeckung aus pytest-cov
sonar.python.version=3.12
sonar.python.coverage.reportPaths=services/ai-assist/coverage.xml

# Was keine Abdeckung braucht: Skripte der Gates, Konfiguration, Bootstrap.
sonar.coverage.exclusions=scripts/**,evals/**,.github/**,frontend/src/main.ts,frontend/src/app/app.config.ts,services/scheduling/infrastructure/src/main/java/de/aptum/scheduling/infrastructure/AptumApplication.java
