# nginx als Auslieferer und Reverse Proxy - dieselbe Aufteilung wie in
# proxy.conf.json, nur für den Betrieb. Die Dienstnamen kommen aus compose
# (oder aus dem Cluster); wer sie ändert, ändert sie hier und dort.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Der AI-Dienst: nur die Erfassung. Steht vor der allgemeinen /api-Regel,
  # weil nginx den längsten passenden Präfix nimmt.
  location /api/erfassung {
    proxy_pass http://ai-assist:8090/erfassung;
    proxy_set_header Host $host;
    proxy_set_header X-Mandant $http_x_mandant;
    proxy_read_timeout 60s;
  }

  # Alles andere unter /api: der Scheduling-Dienst. Das Präfix wird
  # abgeschnitten, /api/termine/suche wird zu /termine/suche.
  location /api/ {
    proxy_pass http://scheduling:8080/;
    proxy_set_header Host $host;
    proxy_set_header X-Mandant $http_x_mandant;
  }

  # Die Anwendung: jede unbekannte Adresse ist eine Route von Angular, nicht
  # ein fehlender Ordner. Ohne diese Zeile ist ein Neuladen auf /kalender
  # ein 404.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Gebaute Dateien tragen einen Hash im Namen und dürfen lange im Cache
  # bleiben; index.html nicht, sonst sieht niemand die nächste Version.
  location ~* \.(js|css|woff2?|png|svg|ico)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
