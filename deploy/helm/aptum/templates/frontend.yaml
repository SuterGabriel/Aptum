# Das Frontend: nginx liefert die Anwendung aus und reicht /api an die beiden
# Dienste weiter - über deren Service-Namen im Cluster.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels: {{- include "aptum.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels: {{- include "aptum.selektor" (dict "Release" .Release "komponente" "frontend") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "aptum.selektor" (dict "Release" .Release "komponente" "frontend") | nindent 8 }}
    spec:
      {{- if .Values.bilder.pullSecret }}
      imagePullSecrets:
        - name: {{ .Values.bilder.pullSecret }}
      {{- end }}
      containers:
        - name: frontend
          image: {{ include "aptum.bild" (dict "Values" .Values "komponente" "frontend") }}
          imagePullPolicy: {{ .Values.bilder.pullPolicy }}
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 5
          resources: {{- toYaml .Values.frontend.ressourcen | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels: {{- include "aptum.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.typ }}
  selector: {{- include "aptum.selektor" (dict "Release" .Release "komponente" "frontend") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
      {{- if eq .Values.frontend.service.typ "NodePort" }}
      nodePort: {{ .Values.frontend.service.nodePort }}
      {{- end }}
